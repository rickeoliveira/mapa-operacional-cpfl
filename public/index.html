<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#10263f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="/manifest.webmanifest">
  <title>Mapa Operacional CPFL</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.css">
  <link rel="stylesheet" href="/style.css">
  <style>
    .asset-marker{width:11px!important;height:11px!important}.feeder-filter[hidden]{display:none!important}
    @media (max-width:768px), (pointer:coarse){
      html,body{width:100%;height:100%;overflow:hidden;background:#10263f}
      #map{height:100dvh;min-height:100vh}
      .panel{top:calc(10px + env(safe-area-inset-top));left:calc(10px + env(safe-area-inset-left));max-height:42vh}
      .leaflet-bottom{bottom:max(var(--map-controls-bottom,12px),calc(12px + env(safe-area-inset-bottom)))}
      .leaflet-right{right:max(12px,env(safe-area-inset-right))}
      .leaflet-control{margin-bottom:10px!important}
      .leaflet-bar a,.current-location-button,.leaflet-control-layers-toggle{width:44px!important;height:44px!important;line-height:44px!important}
      .leaflet-control-zoom a{font-size:29px!important}
      .current-location-button svg{width:24px;height:24px}
      .leaflet-control-layers-toggle{background-size:26px 26px!important}
      .leaflet-control-layers{max-width:calc(100vw - 24px)}
    }
  </style>
</head>
<body>
  <aside class="panel" id="panel">
    <div class="panel-header"><div class="brand"><span class="bolt">⌁</span><div><h1>Mapa operacional</h1><p>Rede elétrica CPFL</p></div></div><button id="panelToggle" class="panel-toggle" type="button" aria-label="Recolher painel de filtros" aria-expanded="true"><span aria-hidden="true">‹</span></button></div>
    <div class="panel-content">
    <label for="search">Número operativo ou rua</label>
    <div class="search-wrap"><input id="search" autocomplete="off" placeholder="Ex.: 1024781 ou Av. Paulista"><button id="searchButton" aria-label="Pesquisar">⌕</button></div>
    <div id="results" class="results"></div>
    <div class="filter-heading"><span class="section-title">Tipos de equipamento</span><button id="typesAll" class="text-action" type="button">Todos</button><button id="typesNone" class="text-action" type="button">Nenhum</button></div>
    <div id="filters" class="filters"></div>
    <div class="network-toggle"><label class="switch-toggle"><input id="networkVisible" type="checkbox" checked> Exibir rede por alimentador</label><small>Cada alimentador possui uma cor própria.</small></div>
    <details class="feeder-box" open><summary>Alimentadores e cores <span id="feederSelectionCount"></span></summary><div class="feeder-search-wrap"><input id="feederSearch" autocomplete="off" placeholder="Digite o alimentador, ex.: BBA"><button id="feederSearchClear" type="button" aria-label="Limpar busca">×</button></div><div class="feeder-actions"><button id="feedersMatched" type="button">Selecionar resultados</button><button id="feedersAll" type="button">Todos</button><button id="feedersNone" type="button">Nenhum</button></div><p id="feederSearchHint" class="feeder-search-hint">Todos os alimentadores estão selecionados.</p><div id="feeders" class="feeders"></div></details>
    <p id="status" class="status">Carregando ativos da região…</p>
    <div class="legend"><span><i class="dot"></i> ativo operacional</span><span>Passe o mouse ou clique em um ponto para identificar o item.</span></div>
    </div>
  </aside>
  <main id="map" aria-label="Mapa de ativos da rede elétrica"></main>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.js"></script>
  <script src="/app.js"></script>
</body>
</html>
